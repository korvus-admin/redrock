name: Build installable zips

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP
        run: find wp-content -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build zips
        run: bash scripts/build-zips.sh
      - uses: actions/upload-artifact@v4
        with:
          name: redrock-zips
          path: dist/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
